name: MoonKeyguard CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  moonbit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show MoonBit version
        run: moon version --all

      - name: Check
        run: moon check --deny-warn

      - name: Build
        run: moon build

      - name: Test
        run: moon test --deny-warn

      - name: Format
        run: |
          set -o pipefail
          if moon fmt --check 2>&1 | tee "$RUNNER_TEMP/moonkeyguard-fmt-check.log"; then
            exit 0
          fi
          # Emit the formatter's exact diff as check annotations so a logged-out
          # reviewer can inspect the remaining mismatch without job-log access.
          moon fmt >/dev/null
          git diff --no-ext-diff --unified=0 -- . ':(exclude)_build' > "$RUNNER_TEMP/moonkeyguard-fmt.diff"
          python3 - <<'PY'
          import re
          import os
          from pathlib import Path

          current = None
          line = 0
          diff = Path(os.environ["RUNNER_TEMP"]) / "moonkeyguard-fmt.diff"
          for raw in diff.read_text(encoding="utf-8", errors="replace").splitlines():
              if raw.startswith("+++ b/"):
                  current = raw[6:]
                  continue
              if raw.startswith("@@"):
                  match = re.search(r"\+(\d+)", raw)
                  if match:
                      line = int(match.group(1))
                  continue
              if current and raw.startswith("+") and not raw.startswith("+++"):
                  message = raw[1:].replace("%", "%25").replace("\r", "").replace("\n", "")
                  print(f"::error file={current},line={line}::{message}")
                  line += 1
              elif current and raw.startswith("-") and not raw.startswith("---"):
                  continue
          PY
          cat "$RUNNER_TEMP/moonkeyguard-fmt.diff"
          exit 1

      - name: Public API snapshot
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

      - name: Package inspection
        run: moon package --list

      - name: CLI smoke test
        run: moon run cmd/main -- --format json --metrics --suggest

      - name: Example smoke test
        run: moon run examples/basic

      - name: Baseline example smoke test
        run: moon run examples/baseline
